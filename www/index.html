<meta charset="utf-8">

<title>Tuition Saathi</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mut:#5b6784;--pri:#17356b;--onpri:#fff;--acc:#f2a900;--ok:#1e8e5a;--bad:#c73e3e;--line:#dde3ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#eef2fa;--mut:#9aa8c7;--pri:#27407a;--acc:#f2b52e;--ok:#4cc38a;--bad:#ef7676;--line:#27365a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#eef2fa;--mut:#9aa8c7;--pri:#27407a;--acc:#f2b52e;--ok:#4cc38a;--bad:#ef7676;--line:#27365a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:92px}
main{padding:0 14px 14px;max-width:640px;margin:0 auto}
.hero{background:var(--pri);color:#fff;padding:18px 16px 20px;border-radius:0 0 22px 22px;margin:0 -14px 14px}
.hero h1{margin:0;font-size:24px}
.hero p{margin:2px 0 12px;opacity:.85;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}
h2{font-size:18px;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:28px;line-height:1.1}
.tile span{color:var(--mut);font-size:14px}
.warn{border:2px solid var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0}
button,.btn{font:inherit;font-weight:600;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.big{width:100%;background:var(--acc);color:#14213d;border-color:var(--acc);font-size:18px}
.p.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.a.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.wa{background:#1f9d55;color:#fff;border-color:#1f9d55;min-height:38px;font-size:14px}
.chip{font-size:13px;padding:2px 10px;border-radius:99px;font-weight:600}
.ok{background:var(--ok);color:#fff}.no{background:var(--acc);color:#14213d}
.gap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.q button{flex-direction:column;font-size:13px;padding:10px 2px}
.q i{font-style:normal;font-size:22px}
.plan{border:2px solid var(--pri)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;color:var(--mut);flex-direction:column;font-size:11px;padding:6px 1px;min-height:48px}
nav i{font-style:normal;font-size:20px}
nav button.on{color:var(--pri);background:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.logo{display:inline-flex;line-height:0}.sv{position:sticky;bottom:78px;z-index:5}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:42px;padding:0;border-radius:10px}.day.P{background:var(--ok);color:#fff;border-color:var(--ok)}.day.A{background:var(--bad);color:#fff;border-color:var(--bad)}
.lang{min-height:36px;background:transparent;color:#fff;border-color:#ffffff66;padding:4px 12px}
</style>
</head>

const SYNC_URL='https://tuition-saathi-default-rtdb.firebaseio.com',SYNC_ON=SYNC_URL!=='REPLACE';

async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}}
const curl=ph=>SYNC_URL.replace(/\/$/,'')+'/u/'+ph+'.json';
async function cget(ph){const r=await fetch(curl(ph),{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
async function cput(ph,body){const r=await fetch(curl(ph),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0}
function mark(){meta.dirty=true;saveMeta();if(SYNC_ON){clearTimeout(syncT);syncT=setTimeout(sync,1200)}}
function merge(L,R){
  const o=Object.assign({},D,R,L),del=[...new Set([...(L.del||[]),...(R.del||[])])];
  const byId=(x,y)=>{const m={};(y||[]).concat(x||[]).forEach(e=>m[e.id]=e);return Object.values(m)};
  o.b=byId(L.b,R.b);
  const sm={};(R.s||[]).forEach(s=>sm[s.id]=s);
  (L.s||[]).forEach(s=>{const r=sm[s.id]||{};sm[s.id]=Object.assign({},r,s,{p:Object.assign({},r.p,s.p)})});
  o.s=Object.values(sm).filter(s=>!del.includes(s.id));o.del=del;
  o.a={};new Set([...Object.keys(R.a||{}),...Object.keys(L.a||{})]).forEach(k=>{o.a[k]=Object.assign({},(R.a||{})[k],(L.a||{})[k])});
  o.n=byId(L.n,R.n).sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:0);
  o.plan=(L.plan==='pro'||R.plan==='pro')?'pro':'free';
  o.used=[...new Set([...(L.used||[]),...(R.used||[])])];
  o.acc=Object.assign({},R.acc,L.acc);
  return o}
async function sync(){
  if(!SYNC_ON||busy||locked||!S.acc.phone||!S.acc.pin||!navigator.onLine)return;
  busy=true;let changed=false;
  try{
    const ph=S.acc.phone,hp=await H('tsv1|'+ph+'|'+S.acc.pin),r=await cget(ph),has=!!(r&&r.d);
    if(has){
      if(r.ph!==hp&&!meta.pinChg){locked=true;try{localStorage.removeItem('ts1in')}catch(e){}msg=t('pinch');busy=false;render();return}
      if(r.ts!==meta.base){const R=JSON.parse(r.d);S=meta.dirty?merge(S,R):Object.assign({},D,R);rawSave();meta.base=r.ts;saveMeta();changed=true}
    }
    if(meta.dirty||!has){
      meta.dirty=false;const ts=Date.now(),body={ph:hp,ts:ts,d:JSON.stringify(S)};
      try{await cput(ph,body);meta.base=ts;meta.pinChg=false}catch(e){meta.dirty=true;throw e}
      saveMeta()}
    const n=new Date();syncst='ok '+pad(n.getHours())+':'+pad(n.getMinutes());
  }catch(e){syncst='err'}
  busy=false;
  const ae=document.activeElement;
  if(changed&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();
}
function unlockNow(){locked=false;msg='';try{localStorage.setItem('ts1in','1')}catch(e){}sync()}
async function doSignup(){
  const n=$('#ln').value.trim(),p=$('#lp').value.trim(),p2=$('#lp2').value.trim();
  if(!/^\d{10}$/.test(n))msg=t('badnum');else if(!/^\d{4,6}$/.test(p))msg=t('badpl');else if(p!==p2)msg=t('nomatch');
  else{
    let isNew=true;
    if(SYNC_ON){
      try{const hp=await H('tsv1|'+n+'|'+p),r=await cget(n);
        if(r&&r.d){if(r.ph!==hp){msg=t('exist');render();return}S=Object.assign({},D,JSON.parse(r.d));meta.base=r.ts;meta.dirty=false;isNew=false}
      }catch(e){msg=t('neterr');render();return}
    }
    S.acc.phone=n;S.acc.pin=p;rawSave();if(isNew)mark();else saveMeta();unlockNow();
  }
  render();
}
async function doLogin(){
  const p=$('#lp').value.trim(),n=$('#ln')?$('#ln').value.trim():S.acc.phone;
  if(p===S.acc.pin&&(!S.acc.phone||n===S.acc.phone))unlockNow();
  else if(SYNC_ON&&/^\d{10}$/.test(n)&&p){
    try{const hp=await H('tsv1|'+n+'|'+p),r=await cget(n);
      if(r&&r.d&&r.ph===hp){S=Object.assign({},D,JSON.parse(r.d));S.acc.phone=n;S.acc.pin=p;rawSave();meta.base=r.ts;meta.dirty=false;saveMeta();unlockNow()}
      else msg=t('wronglg')}catch(e){msg=t('neterr')}
  }else msg=t('wronglg');
  render();
}

function render(){

  document.documentElement.lang=hi()?'hi':'en';
  const tb=[['home','🏠'],['kids','👥'],['att','📋'],['cal','📅'],['fee','💰']];
  $('#nav').innerHTML=tb.map(x=>'<button data-a="tab" data-i="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'"><i>'+x[1]+'</i>'+t(x[0])+'</button>').join('');
  $('#app').innerHTML=(tab==='home'?'':'<div class="top" style="padding:14px 0 0"><b>'+esc(ctr())+'</b><span><button data-a="lg">'+(hi()?'English':'हिन्दी')+'</button> <button data-a="menu" aria-label="Menu" style="font-size:20px">'+(tab==='acc'?'✕':'☰')+'</button></span></div>')+V[tab]();
  if(upd)$('#app').insertAdjacentHTML('afterbegin',updBox());

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,i=el.dataset.i,v=id=>$(id)?$(id).value.trim():'';
  msg=a==='sacc'||a==='adds'?'':msg;
  if(a==='tab'){tab=i;arm=null;msg='';cpm='';bm='';rm='';bkc=''}
  else if(a==='menu'){tab=tab==='acc'?'home':'acc';arm=null;msg='';cpm='';bm='';rm='';bkc=''}
  else if(a==='updx'){upd=null}
  else if(a==='lg'){lang=hi()?'en':'hi';try{localStorage.setItem('ts1l',lang)}catch(x){}}
  else if(a==='tog'){open=open===i?null:i;arm=null}
  else if(a==='addb'){const n=v('#bn');if(!n)return;S.b.push({id:uid(),name:n});save()}
  else if(a==='adds'){const n=v('#sn'),f=v('#sf');if(!n||!f){msg=t('needn');render();return}if(!pro()&&S.s.length>=FREE_MAX){msg=t('lim');render();return}const r=v('#sr');if(r&&S.s.some(x=>x.b===i&&String(x.r)===r)){msg=t('rl')+' '+r+' ✗';render();return}S.s.push({id:uid(),b:i,r:r,name:n,ph:v('#sp'),fee:f,p:{}});save()}
  else if(a==='dels'){if(arm!==i){arm=i}else{S.s=S.s.filter(s=>s.id!==i);S.del=(S.del||[]).concat(i);arm=null;save()}}
  else if(a==='mk'){const k=ad()+'|'+bsel;S.a[k]=S.a[k]||{};if(S.a[k][i]===el.dataset.v)S.a[k][i]='';else S.a[k][i]=el.dataset.v;save();msg=t('svok')}
  else if(a==='pay'){const s=S.s.find(x=>x.id===i);s.p=s.p||{};if(s.p[mon()])s.p[mon()]=false;else s.p[mon()]=true;save()}
  else if(a==='sacc'){S.acc={name:v('#an'),centre:v('#ac'),phone:v('#ap'),upi:v('#au'),pin:S.acc.pin};msg=t('saved');save()}
  else if(a==='cpn'){const c=v('#cc').toUpperCase();if(CP[c]!==undefined){cp=CP[c];cpm=t('cpok')}else{cp=0;cpm=t('bad')}}
  else if(a==='unl'){S.plan='pro';save()}
  else if(a==='actv'){const c=v('#ak').toUpperCase();if(ACT.includes(c)&&!S.used.includes(c)){S.plan='pro';S.used.push(c);save()}else cpm=t('wrong')}
  else if(a==='addn'){const x=v('#ntx');if(!x)return;const n={id:uid(),t:v('#nt'),b:v('#nb'),text:x,d:today()};S.n.unshift(n);shw=n.id;save()}
  else if(a==='shw'){shw=i}
  else if(a==='gd'){adate=i;const st=S.s.find(x=>x.id===cs);if(st)bsel=st.b;tab='att'}
  else if(a==='pm'){cm--;if(cm<0){cm=11;cy--}}
  else if(a==='nm'){cm++;if(cm>11){cm=0;cy++}}
  else if(a==='unlk'){if(v('#pn')===S.acc.pin){locked=false;msg=''}else msg=t('badpin')}
  else if(a==='spin'){const p=v('#pp');if(p){S.acc.pin=p;meta.pinChg=true}else delete S.acc.pin;save()}
  else if(a==='syncnow'){sync().then(render);return}
  else if(a==='svatt'){save();msg=t('svok')+' '+ad()}
  else if(a==='signup'){doSignup();return}
  else if(a==='login'){doLogin();return}
  else if(a==='lm'){lmode=lmode==='login'?'':'login';msg=''}
  else if(a==='logout'){locked=true;msg='';try{localStorage.removeItem('ts1in')}catch(x){}}
  else if(a==='bk'){bkc=enc();bm=t('svok');try{claude.use('downloads').then(d=>{if(d)d.save({filename:'tuition-saathi-backup-'+today()+'.txt',data:bkc}).catch(()=>{})}).catch(()=>{})}catch(x){}}
